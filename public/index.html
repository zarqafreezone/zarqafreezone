<!-- ===== إصلاح ذاتي: مسح SW/كاش قديم عند كل إصدار جديد (مرة واحدة) ===== -->
<script>
(function(){
  var BUILD='zfz-v27';
  try{
    if(localStorage.getItem('fz_build')===BUILD) return;
    localStorage.setItem('fz_build',BUILD);
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
    if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
    if(sessionStorage.getItem('fz_healed')!=='1'){ sessionStorage.setItem('fz_healed','1'); location.reload(); }
  }catch(e){}
})();
</script>
